services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bi_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/bi_engine
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - postgres
      - qdrant
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    environment:
      API_UPSTREAM: api:8000
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  qdrantdata:
